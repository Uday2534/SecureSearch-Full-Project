name: SecureSearch integration build

on:
  push:
    branches:
      - feature/forward-private-verifiable-search
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        working-directory: SecureSearch/client
        run: npm install
      - name: Install C++ oracle dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and verify OpenSSE compatibility oracle
        working-directory: SecureSearch
        run: |
          g++ -std=c++17 experiments/diana-reference/opensse-diana-oracle.cpp -lcrypto -o /tmp/opensse-diana-oracle
          /tmp/opensse-diana-oracle > /tmp/opensse-vectors.generated.json
          diff -u client/src/secure/diana/fixtures/opensse-vectors.json /tmp/opensse-vectors.generated.json
      - name: Build and run pinned upstream OpenSSE Diana executable
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsodium-dev librocksdb-dev libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev
          git clone https://github.com/OpenSSE/opensse-schemes.git /tmp/opensse-schemes
          git -C /tmp/opensse-schemes checkout 084e80bb1223560d30024b7d20b165e3dfc64426
          git -C /tmp/opensse-schemes submodule update --init --recursive
          # Build only the upstream Diana scheme and its own debug harness.
          # The full upstream project also requires a separately built gRPC toolchain;
          # it is not needed to run the local Diana client/server reference test.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/opensse-schemes/CMakeLists.txt")
          source = root.read_text()
          source = source.replace("find_package(Protobuf)" + chr(10) + "find_package(GRPC)" + chr(10), "")
          source = source.replace("add_subdirectory(src)" + chr(10), "")
          source = source.replace("add_subdirectory(test)" + chr(10), "")
          source += chr(10) + "add_executable(diana_upstream_debug test/debug_diana.cpp)" + chr(10) + "target_link_libraries(diana_upstream_debug OpenSSE::schemes)" + chr(10)
          root.write_text(source)
          lib = Path("/tmp/opensse-schemes/lib/CMakeLists.txt")
          source = lib.read_text()
          source = source[:source.index("set(PROTOS")]
          lib.write_text(source)
          PY
          cmake -S /tmp/opensse-schemes -B /tmp/opensse-schemes/build -Dopensse_ENABLE_WERROR=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/opensse-schemes/build --target diana_upstream_debug -j2
          mkdir -p /tmp/opensse-diana-run
          cd /tmp/opensse-diana-run
          /tmp/opensse-schemes/build/diana_upstream_debug | tee diana-output.txt
          grep -F "Search toto. Results: [0, 1, 2," diana-output.txt
          grep -F "Search titi. Results: [0," diana-output.txt
          grep -F "Search tata. Results: [0," diana-output.txt
      - name: Run Diana unit tests
        working-directory: SecureSearch/client
        run: npm test
      - name: Build client
        working-directory: SecureSearch/client
        run: npm run build
      - name: Install server dependencies
        working-directory: SecureSearch/server
        run: npm install
      - name: Build server
        working-directory: SecureSearch/server
        run: npm run build
