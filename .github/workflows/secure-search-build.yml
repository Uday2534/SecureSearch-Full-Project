name: SecureSearch integration build

on:
  push:
    branches:
      - feature/forward-private-verifiable-search
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        working-directory: SecureSearch/client
        run: npm install
      - name: Install C++ oracle dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and verify OpenSSE compatibility oracle
        working-directory: SecureSearch
        run: |
          g++ -std=c++17 experiments/diana-reference/opensse-diana-oracle.cpp -lcrypto -o /tmp/opensse-diana-oracle
          /tmp/opensse-diana-oracle > /tmp/opensse-vectors.generated.json
          diff -u client/src/secure/diana/fixtures/opensse-vectors.json /tmp/opensse-vectors.generated.json
      - name: Run Diana unit tests
        working-directory: SecureSearch/client
        run: npm test
      - name: Build client
        working-directory: SecureSearch/client
        run: npm run build
      - name: Install server dependencies
        working-directory: SecureSearch/server
        run: npm install
      - name: Build server
        working-directory: SecureSearch/server
        run: npm run build
