name: SecureSearch integration build

on:
  push:
    branches:
      - feature/forward-private-verifiable-search
      - ci/upstream-diana-full-crypto-build
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        working-directory: SecureSearch/client
        run: npm install
      - name: Install C++ oracle dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and verify OpenSSE compatibility oracle
        working-directory: SecureSearch
        run: |
          g++ -std=c++17 experiments/diana-reference/opensse-diana-oracle.cpp -lcrypto -o /tmp/opensse-diana-oracle
          /tmp/opensse-diana-oracle > /tmp/opensse-vectors.generated.json
          diff -u client/src/secure/diana/fixtures/opensse-vectors.json /tmp/opensse-vectors.generated.json
      - name: Build and run pinned upstream OpenSSE Diana executable
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsodium-dev libgmp-dev librocksdb-dev libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev
          git clone https://github.com/OpenSSE/opensse-schemes.git /tmp/opensse-schemes
          git -C /tmp/opensse-schemes checkout 084e80bb1223560d30024b7d20b165e3dfc64426
          git -C /tmp/opensse-schemes submodule update --init --recursive
          # The pinned crypto-tk revision requires RELIC 0.5.0. Build it with
          # the GMP backend, matching the upstream crypto-tk documentation.
          git clone --depth 1 --branch relic-toolkit-0.5.0 https://github.com/relic-toolkit/relic.git /tmp/relic
          cmake -S /tmp/relic -B /tmp/relic/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSHLIB=on -DMULTI=PTHREAD \
            -DCOMP="-O3 -funroll-loops -fomit-frame-pointer -finline-small-functions -fPIC" \
            -DARCH=X64 -DRAND=UDEV \
            -DWITH="BN;DV;FP;FPX;EP;EPX;PP;PC;MD" \
            -DCHECK=off -DVERBS=off -DDEBUG=off -DBENCH=0 -DTESTS=1 \
            -DARITH=gmp -DFP_PRIME=254 -DFP_QNRES=off \
            -DFP_METHD="INTEG;INTEG;INTEG;MONTY;LOWER;SLIDE" \
            -DFPX_METHD="INTEG;INTEG;LAZYR" -DPP_METHD="LAZYR;OATEP" \
            -DBN_PRECI=256 -DFP_QNRES=on
          cmake --build /tmp/relic/build --parallel 2
          sudo cmake --install /tmp/relic/build
          sudo ldconfig
          # RELIC 0.5.0 packs its 64-byte-aligned BLAKE2 state structs inside
          # a 1-byte packing region. Recent GCC rejects arrays of those types.
          # Keep the parameter structs packed, but declare state structs normally.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/relic/src/md/blake2.h")
          source = path.read_text()
          source = source.replace(
              "  } blake2b_param;\n\n  ALIGNME( 64 ) typedef struct __blake2s_state",
              "  } blake2b_param;\n#pragma pack(pop)\n\n  ALIGNME( 64 ) typedef struct __blake2s_state",
              1,
          )
          source = source.replace(
              "  } blake2bp_state;\n#pragma pack(pop)",
              "  } blake2bp_state;",
              1,
          )
          path.write_text(source)
          PY
          python3 - <<'PY'
          from pathlib import Path
          header = Path("/tmp/opensse-schemes/third_party/crypto/src/include/sse/crypto/random.hpp")
          source = header.read_text()
          if "#include <cstdint>" not in source:
              source = source.replace("#include <array>", "#include <array>" + chr(10) + "#include <cstdint>")
              header.write_text(source)
          # hash.cpp also uses uint8_t directly and must include its defining header.
          hash_source = Path("/tmp/opensse-schemes/third_party/crypto/src/hash.cpp")
          source = hash_source.read_text()
          if "#include <cstdint>" not in source:
              source = source.replace("#include <array>", "#include <array>" + chr(10) + "#include <cstdint>")
              hash_source.write_text(source)
          # The pinned crypto-tk headers rely on transitive standard-library includes
          # that newer GCC no longer supplies. Add the required direct includes.
          for relative in [
              "third_party/crypto/src/include/sse/crypto/key.hpp",
              "third_party/crypto/src/cipher.cpp",
          ]:
              path = Path("/tmp/opensse-schemes") / relative
              source = path.read_text()
              if "#include <stdexcept>" not in source:
                  source = source.replace("#include <", "#include <stdexcept>" + chr(10) + "#include <", 1)
                  path.write_text(source)
          PY
          # db_generator.hpp uses std::string but omits its direct header.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/opensse-schemes/lib/include/sse/schemes/utils/db_generator.hpp")
          source = path.read_text()
          if "#include <string>" not in source:
              source = source.replace("#include <functional>", "#include <functional>" + chr(10) + "#include <string>")
              path.write_text(source)
          PY
          # The pinned OpenSSE RocksDB wrapper sets an option removed in
          # RocksDB 9.x. It is not required for Diana's counter-map behavior.
          python3 - <<'PY'
          from pathlib import Path
          for relative in [
              "lib/include/sse/schemes/utils/rocksdb_wrapper.hpp",
              "lib/utils/rocksdb_wrapper.cpp",
          ]:
              path = Path("/tmp/opensse-schemes") / relative
              source = path.read_text()
              source = source.replace("    options.new_table_reader_for_compaction_inputs = true;" + chr(10), "")
              path.write_text(source)
          PY
          # Build only the upstream Diana scheme and its own debug harness.
          # The full upstream project also requires a separately built gRPC toolchain;
          # it is not needed to run the local Diana client/server reference test.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/opensse-schemes/CMakeLists.txt")
          source = root.read_text()
          source = source.replace("find_package(Protobuf)" + chr(10) + "find_package(GRPC)" + chr(10), "")
          source = source.replace("add_subdirectory(src)" + chr(10), "")
          source = source.replace("add_subdirectory(test)" + chr(10), "")
          source = source.replace("add_subdirectory(third_party/crypto/src)", """
          set(CRYPTO_ROOT ${CMAKE_CURRENT_SOURCE_DIR}/third_party/crypto/src)
          list(APPEND CMAKE_MODULE_PATH ${CRYPTO_ROOT}/cmake/modules)
          # crypto-tk 60b0db0 expects a Findrelic.cmake module, but that
          # module is absent from the pinned submodule. Resolve the installed
          # RELIC 0.5.0 headers and shared library explicitly.
          file(WRITE ${CRYPTO_ROOT}/cmake/modules/Findrelic.cmake
            "find_path(RLC_INCLUDE_DIR relic/relic.h)\\nfind_library(RLC_LIBRARY NAMES relic)\\ninclude(FindPackageHandleStandardArgs)\\nfind_package_handle_standard_args(relic REQUIRED_VARS RLC_INCLUDE_DIR RLC_LIBRARY)\\n")
          find_library(SODIUM_LIBRARY sodium REQUIRED)
          find_library(GMP_LIBRARY gmp REQUIRED)
          find_library(GMPXX_LIBRARY gmpxx REQUIRED)
          add_library(sse_crypto SHARED
            ${CRYPTO_ROOT}/cipher.cpp
            ${CRYPTO_ROOT}/key.cpp
            ${CRYPTO_ROOT}/prg.cpp
            ${CRYPTO_ROOT}/tdp.cpp
            ${CRYPTO_ROOT}/prp.cpp
            ${CRYPTO_ROOT}/hmac.cpp
            ${CRYPTO_ROOT}/prf.cpp
            ${CRYPTO_ROOT}/puncturable_enc.cpp
            ${CRYPTO_ROOT}/random.cpp
            ${CRYPTO_ROOT}/utils.cpp
            ${CRYPTO_ROOT}/set_hash.cpp
            ${CRYPTO_ROOT}/rcprf.cpp
            ${CRYPTO_ROOT}/wrapper.cpp
            ${CRYPTO_ROOT}/hash.cpp
            ${CRYPTO_ROOT}/hash/blake2b.cpp
            ${CRYPTO_ROOT}/hash/sha512.cpp
            ${CRYPTO_ROOT}/ppke/GMPpke.cpp
            ${CRYPTO_ROOT}/ppke/util.cpp
            ${CRYPTO_ROOT}/ppke/relic_wrapper/relic_api.cpp
            ${CRYPTO_ROOT}/tdp_impl/tdp_impl_mbedtls.cpp
            ${CRYPTO_ROOT}/tdp_impl/tdp_impl_openssl.cpp
            ${CRYPTO_ROOT}/aez/aez.c
            ${CRYPTO_ROOT}/mbedtls/asn1write.c
            ${CRYPTO_ROOT}/mbedtls/bignum.c
            ${CRYPTO_ROOT}/mbedtls/pk.c
            ${CRYPTO_ROOT}/mbedtls/pkparse.c
            ${CRYPTO_ROOT}/mbedtls/rsa_io.c
            ${CRYPTO_ROOT}/mbedtls/asn1parse.c
            ${CRYPTO_ROOT}/mbedtls/base64.c
            ${CRYPTO_ROOT}/mbedtls/pem.c
            ${CRYPTO_ROOT}/mbedtls/pk_wrap.c
            ${CRYPTO_ROOT}/mbedtls/rsa.c)
          target_include_directories(sse_crypto PUBLIC ${CRYPTO_ROOT}/include
            PRIVATE ${CRYPTO_ROOT} ${CRYPTO_ROOT}/include/sse/crypto)
          target_include_directories(sse_crypto SYSTEM PRIVATE
            /usr/local/include ${CRYPTO_ROOT}/ppke/relic_wrapper)
          target_link_libraries(sse_crypto ${SODIUM_LIBRARY} ${GMPXX_LIBRARY}
            ${GMP_LIBRARY} ${RLC_LIBRARY})
          target_compile_features(sse_crypto PUBLIC cxx_std_11)
          add_library(OpenSSE::crypto ALIAS sse_crypto)
          """)
          source += chr(10) + "add_executable(diana_upstream_debug test/debug_diana.cpp)" + chr(10) + "target_link_libraries(diana_upstream_debug OpenSSE::schemes)" + chr(10)
          root.write_text(source)
          lib = Path("/tmp/opensse-schemes/lib/CMakeLists.txt")
          source = lib.read_text()
          source = source[:source.index("set(PROTOS")]
          lib.write_text(source)
          PY
          cmake -S /tmp/opensse-schemes -B /tmp/opensse-schemes/build -Dopensse_ENABLE_WERROR=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/opensse-schemes/build --target diana_upstream_debug -j2
          mkdir -p /tmp/opensse-diana-run
          cd /tmp/opensse-diana-run
          /tmp/opensse-schemes/build/diana_upstream_debug | tee diana-output.txt
          grep -F "Search toto. Results: [0, 1, 2," diana-output.txt
          grep -F "Search titi. Results: [0," diana-output.txt
          grep -F "Search tata. Results: [0," diana-output.txt
      - name: Run Diana unit tests
        working-directory: SecureSearch/client
        run: npm test
      - name: Build client
        working-directory: SecureSearch/client
        run: npm run build
      - name: Install server dependencies
        working-directory: SecureSearch/server
        run: npm install
      - name: Build server
        working-directory: SecureSearch/server
        run: npm run build
